name: tick

on:
  schedule:
    # Only the 06:00 and 12:00 Asia/Tashkent slot windows (01:00-03:59 and 07:00-09:59 UTC);
    # tick does nothing outside them, and every-5-minutes all day would exhaust private-repo Actions minutes.
    - cron: '*/10 1-3,7-9 * * *'
  workflow_dispatch:

# Overlapping runs are safe (tick is idempotent), but there is no reason to stack them.
concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run scheduler
        run: npx tgcloud run endpoints/tick '{}'
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
